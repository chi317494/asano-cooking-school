<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ完了｜淺野料理教室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #FDF8F5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 56px 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(180,120,100,0.12);
    }
    .icon { font-size: 3.5rem; margin-bottom: 20px; }
    h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.3rem;
      color: #5A7F55;
      margin-bottom: 16px;
    }
    p {
      color: #5E584F;
      font-size: 0.9rem;
      line-height: 2;
      margin-bottom: 8px;
    }
    .btns { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
    .btn-line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #8FB08A;
      color: #fff;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #5A7F55;
      font-size: 0.88rem;
      text-decoration: none;
      border: 1.5px solid #8FB08A;
      padding: 12px 28px;
      border-radius: 30px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>お問い合わせを受け付けました</h1>
    <p>2〜3営業日以内にご連絡いたします。</p>
    <p>お急ぎの方はLINEからもお気軽にどうぞ。</p>
    <div class="btns">
      <a href="https://line.me/ti/p/~hukusatohachi" target="_blank" class="btn-line">
        💬 LINEで連絡する
      </a>
      <a href="/" class="btn-back">← トップページに戻る</a>
    </div>
  </div>
</body>
</html>
